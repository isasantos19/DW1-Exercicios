<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Filme - Banco de Dados</title>
    <link rel="stylesheet" href="filme1.css">
</head>

<body onload="listar()">

    <div class="container">
        <h1>Cadastro de Filme</h1>

        <label for="inputId_filme">Id_Filme</label>
        <input type="text" name="inputId_filme" id="inputId_filme">
        <input type="button" value="Procure" id="btProcure" onclick="procure()" style="display:inline;">
        <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
        <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
        <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">

        <label for="inputnome">Nome_Filme</label>
        <input type="text" name="inputnome" id="inputnome">

        <label for="inputdiretor">Diretor_Filme</label>
        <input type="text" name="inputdiretor" id="inputdiretor">

        <label for="inputcategoria">Categoria_Filme</label>
        <input type="number" name="inputcategoria" id="inputcategoria">

        <label for="inputduracao">Duração_filme</label>
        <input type="number" name="inputduracao" id="inputduracao">

        <div id="divAviso">Informe o ID e clique em Procure</div>

        <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
        <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">

        <h3>Filmes Cadastrados:</h3>
        <div id="outputSaida">Carregando...</div>
    </div>


    <script src="./FilmeControle.js"></script>
</body>

</html>
