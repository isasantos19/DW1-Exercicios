<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Filme</title>
    <link rel="stylesheet" href="Filme.css">
</head>

<body onload="listar()">
    <!-- Cabeçalho Semântico -->
    <header>
        <h1>Cadastro de Filme</h1>
        <p>Gerencie seu catálogo de filmes de forma fácil e rápida.</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container-master">
        
        <div class="conteudo-principal">
            <!-- Seção do Formulário -->
            <section class="form-esquerda">
                <h2>Dados do Filme</h2>
                
                <label for="inputId_filme">ID do Filme</label>
                <div class="linha-id">
                    <input type="text" name="inputId_filme" id="inputId_filme" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_filme">Nome do Filme</label>
                <input type="text" name="inputNome_filme" id="inputNome_filme">

                <label for="inputDiretor_filme">Diretor</label>
                <input type="text" name="inputDiretor_filme" id="inputDiretor_filme">

                <label for="inputData_lancamento">Data de Lançamento</label>
                <input type="date" name="inputData_lancamento" id="inputData_lancamento">

                <label for="inputDuracao">Duração (minutos)</label>
                <input type="number" name="inputDuracao" id="inputDuracao">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <!-- Aside para o Cartaz (Conteúdo Lateral) -->
            <aside class="form-direita">
                <h2>Cartaz do Filme</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imgCartaz" src="http://localhost:3001/imagens/silhueta.png" alt="Cartaz do Filme" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;" onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <!-- Seção da Listagem -->
        <section class="lista-filmes">
            <h3>Filmes Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>

    </main>

    <!-- Rodapé Semântico -->
    <footer>
        <p>&copy; 2026 Sistema CRUD Filmes. Todos os direitos reservados.</p>
    </footer>

    <script src="./FilmeControle.js"></script>
</body>

</html>
