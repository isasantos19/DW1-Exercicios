<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculos</title>
</head>
<body>
    <h1><i> Digite um número qualquer !!</i></h1>
    <label for="inputa"> X</label>
    <input type="number" id="inputa">
    <input type="submit" value="Calcule" onclick="submit()">

    <script>
        function submit{
            let num=parseFloat(document.getElementById("inputa").value);
            let resp= num**2;

            document.getElementById("").innerHTML=resp;

        }
    </script>

</body>
</html>
